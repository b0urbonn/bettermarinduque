# Marinduque Circumferential Road funds tracker.
# Rules: every figure and event must cite at least one entry in `sources`.
# Quote all dates ('YYYY', 'YYYY-MM', or 'YYYY-MM-DD') so YAML keeps them as text.
# Update `lastUpdated` whenever anything changes.

title: Marinduque Circumferential Road Funds
lastUpdated: '2026-11-04'
currency: PHP
total: 725064533.85

labels:
  total: Tracked funding and contracts
  received: Enacted appropriations
  scheduled: Proposed
  spent: Reported complete (contract value)
  disputed: Contested items

summary: >-
  The Marinduque Circumferential Road is rehabilitated in sections through
  annual national appropriations implemented by DPWH. Identified items include
  ₱141.67 million in two FY 2026 appropriations, ₱264.82 million of FY 2027
  House bill items — ₱124.83 million under the district office (three road
  sections and five bridges) plus ₱139.999 million under the Central Office,
  of which ₱70 million appears in the House bill only — and four recorded
  contracts totaling about ₱318.5 million: two FY 2025 road-widening
  contracts that passed their November 2025 target dates at about
  three-quarters progress, a completed FY 2019 landslip rehabilitation, and a
  small FY 2025 slope contract. Appropriations and contract values may
  overlap; earlier-year funding is not yet tracked.

summaryTl: >-
  Binabantayan ang mga inilaang pondo ng pambansang gobyerno para sa
  rehabilitasyon ng Marinduque Circumferential Road: ₱141.67 milyon sa dalawang
  FY 2026 na budget item, ₱264.82 milyon sa FY 2027 House bill, at apat
  na kontratang may kabuuang ~₱318.5 milyon. Dalawang FY 2025 na
  road-widening contract ang lumampas sa target na Nobyembre 2025 nang mga
  75% pa lang ang tapos.

# National budget items identified for the road.
inflows:
  - label: FY 2026 appropriation (section K0090+865–K0091+130)
    amount: 92386000
    status: received
    date: '2026'
    note: >-
      Enacted in the FY 2026 General Appropriations Act under DPWH MIMAROPA.
      Procurement status has not been published here.
    sources: [gaa-2026-vol-1c]
  - label: FY 2026 appropriation (sections K0004+600–K0005+200, K0006+682–K0008+000)
    amount: 49286000
    status: received
    date: '2026'
    note: >-
      Second FY 2026 GAA line item for the road identified in BetterGov.ph's
      GAA mirror under DPWH. Procurement status has not been published here.
    sources: [bettergov-gaa-2026]
  - label: FY 2027 House bill — road sections (3 items)
    amount: 56302000
    status: scheduled
    due: FY 2027 budget — pending Senate and bicameral approval
    note: >-
      House Bill 10858 third-reading items for sections K0016+522–K0016+727
      (₱31M), K0017+500–K0017+577 (₱16.15M) and K0093+930–K0094+285 (₱9.152M)
      under the Marinduque District Engineering Office. Same amounts as the
      NEP proposal; not yet enacted into law.
    sources: [bettergov-hgab-mq]
  - label: FY 2027 House bill — bridges along the road (5 items)
    amount: 68523000
    status: scheduled
    due: FY 2027 budget — pending Senate and bicameral approval
    note: >-
      Bridge Program items in House Bill 10858: Ihatub ₱26.91M, Matandang
      Gasan ₱13.524M, Landy ₱11.96M, Cawit ₱8.855M and Caganhao ₱7.274M —
      all along the Marinduque Circumferential Road. Same amounts as the NEP.
    sources: [bettergov-hgab-mq]
  - label: FY 2027 House bill — section K0032+423–K0032+873 (Central Office)
    amount: 70000000
    status: scheduled
    due: FY 2027 budget — pending Senate and bicameral approval
    note: >-
      Appears only in the House bill, not the NEP — an insertion candidate
      under the Asset Preservation Program run by DPWH Central Office, not
      the district office. Not yet enacted into law.
    sources: [bettergov-hgab-2027-714]
  - label: FY 2027 House bill — section K0053+000–K0054+000 (Central Office)
    amount: 69999000
    status: scheduled
    due: FY 2027 budget — pending Senate and bicameral approval
    note: >-
      Network Development Program item under DPWH Central Office. Same
      amount in the NEP and the House bill; not yet enacted.
    sources: [bettergov-hgab-1659]

