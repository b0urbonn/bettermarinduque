  - Which appropriations funded the four recorded contracts — earlier-year GAA items are not yet tracked.
  - Whether the FY 2026 appropriation has been bid out or awarded, and to which contractor.
  - The total estimated cost and completion target for the full road rehabilitation.
  - Payment and disbursement records for the recorded contracts.

