claims: []

timeline:
  - date: '2019-08-30'
    title: Landslip rehabilitation contract begins
    description: >-
      19EA0090 — ₱99.01M to Sunwest Inc for road slips at K0052+690–K0053+100,
      Torrijos; later reported complete.
    sources: [ltp-19ea0090]
  - date: '2025-03-21'
    title: Two FY 2025 widening contracts begin
    description: >-
      25EA0017 (₱108.04M, Amethyst Horizon) and 25EA0018 (₱103.03M, Square
      Cube) cover several kilometers of the circumferential road.
    sources: [ltp-25ea0017, ltp-25ea0018]
  - date: '2025-11'
    title: Both widening contracts pass target dates
    description: >-
      Reported at 74% and 76% progress when their November 2025 target dates
      lapsed; still marked ongoing.
    sources: [ltp-25ea0017, ltp-25ea0018]
  - date: '2026'
    title: FY 2026 GAA appropriates ₱141.67M in two items
    description: >-
      Sections K0090+865–K0091+130 (₱92.39M) and K0004+600–K0005+200,
      K0006+682–K0008+000 (₱49.29M) under DPWH MIMAROPA.
    sources: [gaa-2026-vol-1c, bettergov-gaa-2026]
  - date: '2026'
    title: House bill carries ₱124.83M for FY 2027
    description: >-
      House Bill 10858 (third reading) lists three road sections totaling
      ₱56.30M and five bridges totaling ₱68.52M along the circumferential
      road under the Marinduque District Engineering Office.
    sources: [bettergov-hgab-mq]
  - date: '2026'
    title: House bill carries ₱139.999M more via Central Office
    description: >-
      Two Central Office items name the road for FY 2027: K0053+000–
      K0054+000 (₱69.999M, same as NEP) and K0032+423–K0032+873 (₱70M — in
      the House bill only, an insertion candidate not in the NEP).
    sources: [bettergov-hgab-2027-714, bettergov-hgab-1659]

openQuestions:
