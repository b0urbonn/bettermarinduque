# Selected public records. Describe what each amount measures and cite its source.
- slug: budgets
  name: Budgets and revenue
  description: Explore provincial revenue, national budget items for Marinduque, and local budget sources.
  icon: Wallet
  level: provincial
  records:
    - title: Provincial General Fund revenue
      period: CY 2024
      description: >-
        The province's annual report compares actual General Fund income with its
        estimate. The National Tax Allotment is included in the reported total.
      comparison:
        title: Reported versus estimated income
        figures:
          - label: Reported General Fund income
            amount: 1147549906.38
          - label: Estimated General Fund income
            amount: 1070165714.00
      figures:
        - label: National Tax Allotment received
          amount: 1032987782.00
      source:
        title: 2024 Annual Accomplishment Report, p. 7 (PDF)
        publisher: Provincial Government of Marinduque
        url: https://marinduque.gov.ph/wp-content/uploads/2026/04/2024-PGM-Annual-Accomplishment-Report_compressed-1.pdf
    - title: Final National Tax Allotment memorandum
      period: FY 2026
      description: >-
        DBM's memorandum sets out the final national allotment and includes
        a regional breakdown. Use COMPASS to look up individual LGUs.
      source:
        title: Local Budget Memorandum No. 92B
        publisher: Department of Budget and Management
        url: https://www.dbm.gov.ph/index.php/local-budget-memorandum?catid=402&id=3765&view=article
    - title: Marinduque Circumferential Road appropriation
      period: FY 2026 enacted budget
      description: >-
        The national General Appropriations Act lists this DPWH line item
        under MIMAROPA for the section from K0090+865 to K0091+130.
      figures:
        - label: Enacted national appropriation
          amount: 92386000
      source:
        title: FY 2026 General Appropriations Act, Volume I-C, p. 167 (PDF)
        publisher: Department of Budget and Management
        url: https://www.dbm.gov.ph/wp-content/uploads/GAA/GAA2026/DBM-OFFICIAL-GAZETTE-FY-2026_VOLUME-1-C.pdf
    - title: Marinduque Circumferential Road proposal
      period: FY 2027 House budget bill
      description: >-
        BetterGov.ph identifies this DPWH line item for the section from
        K0032+423 to K0032+873 in House Bill 10858. It runs through the
        DPWH Central Office and appears in the House bill only — not in
        the NEP proposal — making it an insertion candidate.
      figures:
        - label: Proposed amount in the House bill
          amount: 70000000
      source:
        title: 'House bill item: K0032+423–K0032+873'
        publisher: BetterGov.ph Budget
        url: https://budget.bettergov.ph/hgab/2027/dpwh/p/house-reading%3A1494
    - title: Marcopper settlement initial payment
      period: October 2026
      description: >-
        About US$50.71 million of the US$100-million Marcopper settlement was
        transferred to the provincial trust fund. The peso figure is the
        reported equivalent; see the settlement tracker for the full ledger.
      figures:
        - label: Reported peso equivalent received
          amount: 3200000000
      source:
        title: Marinduque governor denies blocking ₱3.2B Marcopper payout
        publisher: Daily Tribune
        url: https://tribune.net.ph/2026/10/23/marinduque-governor-denies-blocking-32b-marcopper-payout
  nextSteps: >-
    For an approved annual budget or a statement of receipts and expenditures,
    search the DILG Full Disclosure Policy Portal by local government unit and year.
    The BetterGov.ph GAA Explorer covers enacted national appropriations.
  directories:
    - name: DILG Full Disclosure Policy Portal
      description: Look up local budgets and financial disclosures.
      url: https://fdpp.dilg.gov.ph/
    - name: DBM COMPASS National Tax Allotment
      description: Browse published allotment data by fiscal year.
      url: https://compass.dbm.gov.ph/nta
    - name: BetterGov.ph GAA Explorer
      description: Browse enacted national budget data published by DBM.
      url: https://budget.bettergov.ph/gaa

