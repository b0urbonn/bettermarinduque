- slug: procurement
  name: Bids and awards
  description: Read selected provincial bid notices and contract award records.
  icon: ClipboardList
  level: provincial
  records:
    - title: Maybo sanitary landfill improvements
      period: July 2026
      description: >-
        The province invited bids for work on the sanitary landfill in Barangay
        Maybo, Boac. PhilGEPS lists the invitation as closed. Solicitation
        Infra 049-2026, reference 13126542.
      figures:
        - label: Approved budget for the contract
          amount: 4999992.15
      source:
        title: PhilGEPS bid notice 13126542
        publisher: Provincial Government of Marinduque via PhilGEPS
        url: https://notices.philgeps.gov.ph/GEPSNONPILOT/Tender/PrintableBidNoticeAbstractUI.aspx?refid=13126542
    - title: Rice for the provincial food distribution program
      period: May 2026 solicitation
      description: >-
        The province used negotiated procurement under Sagip Saka to buy rice
        for its distribution program for low-income households. The listing includes
        the notice of award and contract for reference 300-26-04-039.
      figures:
        - label: Approved budget for the contract
          amount: 33999750.00
        - label: Published award amount
          amount: 33999750.00
      source:
        title: Procurement record 300-26-04-039
        publisher: Department of Agriculture, FFEDIS
        url: https://ffedis.da.gov.ph/negotiated-procurement/public/view/568
    - title: Contracts awarded by the Municipality of Boac
      period: Recorded to date
      description: >-
        PhilGEPS award notices where the municipality itself is the procuring
        entity, consolidated from public records. Barangay-level awards are
        listed separately on the same page.
      figures:
        - label: Total municipal awards on record
          amount: 687718693.59
      source:
        title: Boac public records — PhilGEPS awards
        publisher: Love the Philippines (PhilGEPS mirror)
        url: https://lovethephilippines.com/lgu/1704001000-boac
  nextSteps: >-
    Search PhilGEPS by procuring entity or reference number. The notice of award
    identifies the winning supplier and price. Delivery and payment records show
    what the agency received and paid for.
  directories:
    - name: PhilGEPS public notices
      description: Search bid opportunities and award notices.
      url: https://notices.philgeps.gov.ph/
    - name: DA FFEDIS negotiated procurement
      description: Awarded contracts under negotiated procurement programs.
      url: https://ffedis.da.gov.ph
    - name: Boac public records — PhilGEPS awards
      description: Awards where a Boac LGU or barangay is the buyer.
      url: https://lovethephilippines.com/lgu/1704001000-boac

- slug: infrastructure
  name: Infrastructure projects
  description: Look up selected public works, their locations and published costs.
  icon: HardHat
  level: national
  records:
    - title: Caganhao–Amoingon–Maybo farm-to-market road
      period: June 2025
      description: >-
        The Department of Agriculture reported the opening of the upgraded
        5.125-kilometer road connecting three barangays in Boac.
      figures:
        - label: Reported project cost (rounded)
          amount: 103400000
      source:
        title: PRDP in Focus, June 2025 (PDF)
        publisher: Department of Agriculture, Philippine Rural Development Project
        url: https://prdp.da.gov.ph/wp-content/uploads/2025/08/PSOSL_inFOCUS_June-2025.pdf
    - title: Marinduque Convention Center rehabilitation
      period: FY 2025 plan
      description: >-
        Phase 2 rehabilitation at the Capitol Compound in Barangay Bangbangalon,
        Boac. DPWH project ID 25EA0020.
      figures:
        - label: Estimated budget in the procurement plan
          amount: 128546720.00
      source:
        title: FY 2025 Civil Works Procurement Plan, p. 4 (PDF)
        publisher: DPWH Marinduque District Engineering Office
        url: https://www.dpwh.gov.ph/dpwh/sites/default/files/GAA/APP/fy_2025_app_cw_updated_as_of_june_11_2025.pdf#page=4
    - title: Marlangga flood control structure
      period: FY 2025 plan
      description: >-
        Flood control works in Barangay Marlangga, Torrijos. DPWH project ID
        25EA0019.
      figures:
        - label: Estimated budget in the procurement plan
          amount: 34298000.00
      source:
        title: FY 2025 Civil Works Procurement Plan, p. 3 (PDF)
        publisher: DPWH Marinduque District Engineering Office
        url: https://www.dpwh.gov.ph/dpwh/sites/default/files/GAA/APP/fy_2025_app_cw_updated_as_of_june_11_2025.pdf#page=3
    - title: Marinduque Circumferential Road rehabilitation
      period: FY 2025 contract
      description: >-
        DPWH project 25EA0006 covers slope and landslide repairs along the
        circumferential road. BetterGov.ph lists the project under the
        Marinduque District Engineering Office. The DPWH monitoring report
        gives the contract cost to the centavo.
      figures:
        - label: Contract cost in the DPWH monitoring report
          amount: 8484093.20
      source:
        title: DPWH project listing, search for 25EA0006
        publisher: BetterGov.ph Transparency
        url: https://transparency.bettergov.ph/dpwh/categories/GAA%202025%20OO-1
      relatedSources:
        - title: DPWH procurement monitoring report (PDF)
          publisher: DPWH Marinduque District Engineering Office
          url: https://www.dpwh.gov.ph/dpwh/sites/default/files/pmr/pmr20242ndsemcw.pdf
    - title: Sibuyao National High School classrooms
      period: FY 2019 contract
      description: >-
        DPWH contract 19EA0106 covers a three-storey, six-classroom building
        in Torrijos. BetterGov.ph records a September 2019 award and a
        July 2020 completion date.
      figures:
        - label: Published award amount
          amount: 14192297.48
      source:
        title: DPWH project record 19EA0106
        publisher: BetterGov.ph Transparency
        url: https://transparency.bettergov.ph/dpwh/projects/19EA0106
    - title: DPWH projects in Marinduque — recorded totals
      period: 2016–2025 records
      description: >-
        Consolidated DPWH Transparency Portal records for the province: 1,120
        public works with recorded contract values, of which 155 are flood
        control works. Figures are as recorded by DPWH, not findings.
      figures:
        - label: Recorded contract values, all DPWH works
          amount: 24121368925.64
      source:
        title: DPWH projects in Marinduque
        publisher: Love the Philippines (DPWH records mirror)
        url: https://lovethephilippines.com/places/marinduque
      relatedSources:
        - title: Flood control projects tracker
          publisher: BetterMarinduque
          url: /transparency/flood-control
    - title: Dr. Damian Reyes Road landslip rehabilitation cluster
      period: FY 2023–2024 contracts
      description: >-
        Five of the six largest recorded contracts on this road on the Boac
        side each carry a value near ₱241.2 million, alongside one ₱289.5
        million package — the same near-uniform pricing seen in the seawall
        contracts. Recorded as asset preservation works for road slips.
      figures:
        - label: Largest package (2024)
          amount: 289497642.92
      source:
        title: Boac public records — DPWH project list
        publisher: Love the Philippines (DPWH records mirror)
        url: https://lovethephilippines.com/lgu/1704001000-boac
  nextSteps: >-
    Search the DPWH portal by project ID for contract details and progress.
    For a provincial project, ask the implementing office for its latest
    progress or completion report.
  directories:
    - name: DPWH Infrastructure Projects Portal
      description: Look up contracts and reported progress for DPWH projects.
      url: https://transparency.dpwh.gov.ph/
    - name: BetterGov.ph DPWH project browser
      description: Browse records under the Marinduque District Engineering Office.
      url: https://transparency.bettergov.ph/dpwh/provinces/Marinduque%20DEO
    - name: Sumbong sa Pangulo
      description: Report and inspect flood control projects.
      url: https://sumbongsapangulo.ph

- slug: audits
  name: Audits and reports
  description: Find COA audits and the province's annual accomplishment reports.
  icon: FileCheck
  level: provincial
  records:
    - title: Marinduque annual audit executive summary
      period: CY 2024
      description: Commission on Audit executive summary for the provincial government.
      source:
        title: Marinduque Executive Summary 2024
        publisher: Commission on Audit
        url: https://www.coa.gov.ph/wpfd_file/marinduque-executive-summary-2024/
    - title: Special Education Fund compliance audit
      period: CY 2024
      description: >-
        COA's management letter on how the province allocates, uses and monitors
        its Special Education Fund.
      source:
        title: Marinduque Compliance Audit Report 2024
        publisher: Commission on Audit
        url: https://www.coa.gov.ph/wpfd_file/marinduque-compliance-audit-report-2024/
    - title: Provincial accomplishment report
      period: CY 2024
      description: >-
        The province's own account of its finances, programs and project
        accomplishments during the year.
      source:
        title: 2024 Annual Accomplishment Report (PDF)
        publisher: Provincial Government of Marinduque
        url: https://marinduque.gov.ph/wp-content/uploads/2026/04/2024-PGM-Annual-Accomplishment-Report_compressed-1.pdf
    - title: COA annual audit reports for LGUs
      period: By year and region
      description: >-
        COA publishes full annual audit reports grouped by year. The province
        and its six municipalities are filed under MIMAROPA; each report lists
        audit observations and recommendations.
      source:
        title: Annual Audit Reports — Local Government Units
        publisher: Commission on Audit
        url: https://www.coa.gov.ph/reports/annual-audit-reports/aar-local-government-units/
    - title: COA special audit of DRRM funds
      period: CY 2024 funds
      description: >-
        COA's nationwide audit of disaster funds calls out 70 LGUs for low
        LDRRMF utilization — Marinduque is named among them. The published
        range across LGUs is 1.41% to 67.16% utilization.
      source:
        title: 'Lost opportunity: COA calls out 70 LGUs over low disaster fund use'
        publisher: Rappler
        url: https://www.rappler.com/philippines/coa-special-audit-report-local-disaster-risk-reduction-management-fund-2024/
    - title: Disallowed disaster fund cellphone purchase
      period: CY 2014 audit, reported 2015
      description: >-
        COA's 2014 audit of the province found ₱909,675 in disaster funds was
        spent on 1,300 cellphones for health workers without a valid
        appropriation, and declared the transaction void.
      figures:
        - label: Disallowed amount
          amount: 909675
      source:
        title: "COA: Marinduque used disaster fund for health workers' phones"
        publisher: Rappler
        url: https://www.rappler.com/philippines/102949-marinduque-disaster-fund-phones-coa-audit/
  nextSteps: >-
    In the COA archive, choose a year, then look under MIMAROPA for the
    province or municipality. Look for audit observations, recommendations,
    and any updates on how the local government addressed them.
  directories:
    - name: COA annual audit reports for local governments
      description: Browse audit reports by year and region.
      url: https://www.coa.gov.ph/reports/annual-audit-reports/aar-local-government-units/
    - name: Marinduque provincial annual reports
      description: Browse the province's accomplishment reports by year.
      url: https://marinduque.gov.ph/provincial-annual-report/

- slug: municipal-barangay-records
  name: Municipal and barangay records
  description: >-
    Find budgets, procurement notices, and audit reports for Marinduque's six
    towns and 218 barangays.
  icon: Building2
  level: municipal
  records:
    - title: Full Disclosure Policy filings by LGU
      period: Updated regularly
      description: >-
        Municipalities and barangays must post their budgets, procurement
        plans, and special fund reports on the DILG portal. Choose MIMAROPA,
        then Marinduque, then the town or barangay.
      source:
        title: DILG Full Disclosure Policy Portal
        publisher: Department of the Interior and Local Government
        url: https://fdpp.dilg.gov.ph
    - title: COA annual audit reports for municipalities
      period: By year
      description: >-
        The Commission on Audit files each town's annual audit under MIMAROPA.
        Barangay accounts are examined as part of the municipal audit.
      source:
        title: Annual Audit Reports — Local Government Units
        publisher: Commission on Audit
        url: https://www.coa.gov.ph/reports/annual-audit-reports/aar-local-government-units/
    - title: PhilGEPS awards with municipal and barangay buyers
      period: Recorded to date
      description: >-
        Procurement award notices where a Marinduque municipality or barangay
        is the procuring entity, consolidated from public records. Boac's
        consolidated listing is available; other towns can be checked on
        PhilGEPS directly.
      source:
        title: Boac public records — PhilGEPS awards
        publisher: Love the Philippines (PhilGEPS mirror)
        url: https://lovethephilippines.com/lgu/1704001000-boac
  nextSteps: >-
    On the Full Disclosure Policy Portal, choose MIMAROPA, then Marinduque,
    then the municipality or barangay. For a record that is not posted, ask the
    municipal hall or barangay hall directly — LGUs are required to provide
    public documents on request.
  directories:
    - name: DILG Full Disclosure Policy Portal
      description: Budgets and reports every LGU must publish.
      url: https://fdpp.dilg.gov.ph
    - name: DILG MIMAROPA local government directory
      description: Municipal office phone numbers and email addresses.
      url: https://mimaropa.dilg.gov.ph/contact-us/field-office/
    - name: COA annual audit reports
      description: Municipal audit reports filed under MIMAROPA.
      url: https://www.coa.gov.ph/reports/annual-audit-reports/aar-local-government-units/
    - name: PhilGEPS public notices
      description: Search bids and awards by procuring entity.
      url: https://notices.philgeps.gov.ph/
