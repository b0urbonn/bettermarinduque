# Flood control projects tracker.
# Rules: every figure and event must cite at least one entry in `sources`.
# Quote all dates ('YYYY', 'YYYY-MM', or 'YYYY-MM-DD') so YAML keeps them as text.
# Update `lastUpdated` whenever anything changes.

title: Flood Control Projects
lastUpdated: '2026-11-04'
currency: PHP
total: 6207984078

labels:
  total: Tracked funding and contracts
  received: Enacted appropriations
  scheduled: Planned or tendered
  spent: Reported complete (contract value)
  disputed: Contested items

summary: >-
  DPWH records list about 155 flood control works in Marinduque within roughly
  ₱24 billion of recorded public works. National budget records show ₱3.98
  billion in enacted GAA line items naming Marinduque flood works from
  FY 2020 to FY 2025 — peaking at ₱1.44 billion in FY 2023, then no flood
  line item naming the province at all in FY 2026. Recorded contracts include
  five near-identical ~₱241-million seawall and river works won by HGG
  Builders & Supply in 2023 and four shore protection works near ₱193
  million each. Appropriations and contract values overlap — contracts are
  funded out of the appropriations — and coverage is partial. Flags and
  patterns below are questions raised by the records, not findings.

summaryTl: >-
  May humigit-kumulang 155 flood control project ang naitala ng DPWH sa
  Marinduque. May ₱3.98 bilyon sa national budget na nakalaan sa flood works
  ng Marinduque mula FY 2020 hanggang FY 2025 — pinakamataas ang ₱1.44 bilyon
  noong FY 2023, at walang flood item na pinangalanan ang probinsya sa FY
  2026. Kasama rin ang limang kontratang halos magkakaparehong ~₱241 milyon
  na nakuha ng HGG Builders & Supply noong 2023, at apat na shore protection
  na ~₱193 milyon bawat isa. Ang mga flag sa mga rekord ay mga tanong na
  dapat sagutin, hindi mga hatol.

