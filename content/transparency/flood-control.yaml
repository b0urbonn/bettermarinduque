openQuestions:
  - Which of the ~60 appropriated items became actual contracts — appropriations and recorded contracts overlap but records do not link them.
  - Award notices, contractors, and contract costs for the FY 2025 Boac River upstream items (₱430M) and projects 25EA0019 and 25EA0056.
  - Why the FY 2026 GAA contains no flood control item naming Marinduque after ₱3.98B over five years — a funding gap, or works folded into items that don't name the province.
  - Why five FY 2023 contracts — four seawalls and the Libtangin structure — cluster near ₱241.2 million, and whether each was competitively bid.
  - Whether any Marinduque project appears in ICI referrals or the COA fraud audits the Senate requested.
  - Automated record flags include near-duplicate Santol flood control projects in Boac — whether both were built and where.
  - Inspection and completion documentation for works marked complete, especially along the Boac and Mogpog river systems.

