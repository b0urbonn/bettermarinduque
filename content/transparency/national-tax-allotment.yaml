# National Tax Allotment (NTA) tracker.
# Rules: every figure and event must cite at least one entry in `sources`.
# Quote all dates ('YYYY', 'YYYY-MM', or 'YYYY-MM-DD') so YAML keeps them as text.
# Update `lastUpdated` whenever anything changes.

title: National Tax Allotment
lastUpdated: '2026-11-04'
currency: PHP
total: 1032987782

labels:
  total: NTA tracked
  received: Received
  scheduled: Scheduled
  spent: Reported spending
  disputed: Contested items

summary: >-
  The National Tax Allotment is the province's share of national internal
  revenue and its largest income source. Marinduque reported receiving
  ₱1.033 billion in CY 2024 — about 90% of its General Fund income that year.
  DBM sets the allotment annually through a Local Budget Memorandum; LGU-level
  figures are published on COMPASS. Only confirmed receipts appear in the
  ledger below.

summaryTl: >-
  Ang National Tax Allotment ang pinakamalaking pinagkukunan ng kita ng
  lalawigan: ₱1.033 bilyon ang natanggap noong 2024 — mga siyamnapung porsyento
  ng kita ng General Fund. Taunang itinatakda ng DBM ang allotment; maaaring
  hanapin ang tig-iisang LGU sa COMPASS. Ang huling bilang ng FY 2026 para sa
  Marinduque ay hindi pa nailalathala rito.

# NTA received by the province. Confirmed entries require an official report.
inflows:
  - label: National Tax Allotment, CY 2024
    amount: 1032987782
    status: received
    date: '2024'
    note: >-
      Reported in the province's 2024 Annual Accomplishment Report, which
      counts the NTA within the ₱1.15-billion actual General Fund income.
    sources: [pgm-aar-2024]

# What the NTA paid for. Add entries only from official budget execution
# reports, COA audits, or Full Disclosure Policy postings.
outflows: []

claims: []

timeline:
  - date: '2021-06-01'
    title: Executive Order 138 signed
    description: >-
      Implements the Mandanas ruling: from FY 2022 the LGU share is computed
      from all national taxes, not only internal revenue.
    sources: [eo-138]
  - date: '2024'
    title: ₱1.033 billion received
    description: >-
      NTA reported in the 2024 Annual Accomplishment Report, alongside the
      ₱1.07-billion income estimate.
    sources: [pgm-aar-2024]
  - date: '2024-12-26'
    title: Final FY 2025 NTA shares issued
    description: >-
      DBM Local Budget Memorandum No. 90-A sets the final FY 2025 allotment
      for every LGU; the province's figure is published in the memorandum's
      annex and in BLGF fiscal data.
    sources: [dbm-lbm-90a, blgf-sre]
  - date: '2026'
    title: Final FY 2026 allotments issued
    description: >-
      DBM Local Budget Memorandum No. 92B sets the final national allotment;
      per-LGU amounts are published on COMPASS.
    sources: [dbm-lbm-92b, compass-nta]

openQuestions:
  - The province's final NTA for FY 2025 (LBM 90-A annex) and FY 2026, and each municipality's share.
  - Year-on-year growth of the allotment since the Mandanas implementation.
  - How the NTA is split between devolved services, personnel, and projects.
  - Any NTA withheld or offset for national liabilities.

